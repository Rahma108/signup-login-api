<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="form-container" id="formContainer">
            <!-- Sign In Form -->
            <div class="form-section">
                <h2>Welcome Back</h2>
                <p class="subtitle">Sign in to continue to your account</p>
                <div class="success-message" id="signinSuccess">Successfully signed in!</div>
                <form id="signinForm">
                    <div class="input-group">
                        <label for="signin-email">Email Address</label>
                        <input type="email" id="signin-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" placeholder="Enter your password" required>
                    </div>
                    <div class="forgot-password">
                        <a href="#forgot">Forgot Password?</a>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <!-- connect with backend  -->
                    <button type="submit" class="btn">Login</button>
                </form>
                <p class="toggle-text">
                    Don't have an account? 
                    <a class="toggle-link" id="showSignup">Sign Up</a>
                </p>
            </div>

            <!-- Sign Up Form -->
            <div class="form-section">
                <h2>Create Account</h2>
                <p class="subtitle">Sign up to get started</p>
                <div class="success-message" id="signupSuccess">Account created successfully!</div>
                <form id="signupForm">
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>
                    <!-- connect with backend  -->
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <p class="toggle-text">
                    Already have an account? 
                    <a class="toggle-link" id="showSignin">Sign In</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
